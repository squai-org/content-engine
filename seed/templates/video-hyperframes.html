<!doctype html>
<html lang="es" data-resolution="portrait">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">
<meta name="formats" content="reel">
<meta name="engine" content="hyperframes">
<meta name="footage" content="si">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@700&family=Atkinson+Hyperlegible+Next:wght@400;600&family=Gloria+Hallelujah&display=swap">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
:root { --mid: #0A0C1A; --canvas: #F4F6FF; --main: #44d4c8; --main3: #c8f1ec; --hl: #f9c24d; --head: 'Familjen Grotesk', 'Arial Narrow', sans-serif; --body: 'Atkinson Hyperlegible Next', 'Segoe UI', sans-serif; --hand: 'Gloria Hallelujah', cursive; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--mid); }
#root { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: var(--canvas); font-family: var(--body); }
#stage { position: absolute; inset: 0; transform-origin: 50% 38%; background: linear-gradient(160deg, #2b2f52, #0A0C1A); }
#footage { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
#shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10, 12, 26, 0.55), rgba(10, 12, 26, 0) 24%, rgba(10, 12, 26, 0) 52%, rgba(10, 12, 26, 0.72) 82%); }
#progress { position: absolute; left: 90px; right: 90px; top: 150px; height: 8px; border-radius: 4px; background: rgba(244, 246, 255, 0.3); overflow: hidden; }
#progress i { display: block; width: 100%; height: 100%; background: var(--canvas); transform-origin: left; transform: scaleX(0); }
#handle { position: absolute; left: 90px; top: 190px; font-family: var(--head); font-weight: 700; font-size: 40px; letter-spacing: -0.5px; text-shadow: 0 2px 12px rgba(10, 12, 26, 0.5); }
#hook { position: absolute; left: 90px; right: 90px; top: 300px; font-family: var(--head); font-weight: 700; font-size: 112px; line-height: 1.08; letter-spacing: -0.03em; text-wrap: balance; text-shadow: 0 4px 30px rgba(10, 12, 26, 0.55); visibility: hidden; }
.w { display: inline-block; }
.mark { position: relative; isolation: isolate; display: inline-block; padding: 0 0.14em; margin: 0 -0.04em; color: var(--mid); text-shadow: none; white-space: nowrap; }
.mark::before { content: ''; position: absolute; inset: 0.08em 0 0.02em; z-index: -1; border-radius: 0.28em; background: var(--hl); transform-origin: left; transform: scaleX(var(--ink, 0)); }
.caption { position: absolute; left: 70px; right: 70px; top: 1150px; height: 260px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 0 22px; font-family: var(--head); font-weight: 700; font-size: 92px; line-height: 1.12; letter-spacing: -0.02em; text-align: center; visibility: hidden; }
.caption span { display: inline-block; padding: 0 0.06em; -webkit-text-stroke: 14px var(--mid); paint-order: stroke fill; text-shadow: 0 6px 24px rgba(10, 12, 26, 0.6); }
.caption .strong { color: var(--hl); }
.moment { position: absolute; visibility: hidden; }
.keyword { left: 90px; top: 620px; max-width: 820px; padding: 22px 44px; border-radius: 40px; background: var(--main); color: var(--mid); font-family: var(--head); font-weight: 700; font-size: 84px; line-height: 1.08; letter-spacing: -0.02em; box-shadow: 0 16px 50px rgba(10, 12, 26, 0.35); transform-origin: left bottom; }
.keyword.right { left: auto; right: 90px; transform-origin: right bottom; }
.note { right: 90px; top: 700px; max-width: 620px; font-family: var(--hand); font-size: 62px; line-height: 1.25; text-align: right; text-shadow: 0 2px 14px rgba(10, 12, 26, 0.7); transform-origin: right; }
#cta { position: absolute; left: 60px; right: 60px; bottom: 480px; padding: 44px 50px; border-radius: 52px; background: var(--main); color: var(--mid); box-shadow: 0 20px 60px rgba(10, 12, 26, 0.4); visibility: hidden; }
#cta b { display: block; font-family: var(--head); font-size: 76px; line-height: 1.1; letter-spacing: -0.02em; text-wrap: balance; }
#cta span { display: block; margin-top: 14px; font-family: var(--head); font-weight: 700; font-size: 46px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
<div id="stage">
<video id="footage" class="clip" src="{{footage}}" data-start="0" data-duration="{{duration}}" data-media-start="{{media_start}}" data-track-index="0" data-has-audio="true" playsinline></video>
</div>
<div id="shade"></div>
<div id="progress"><i></i></div>
<div id="handle">@heysquai</div>
<h1 id="hook"></h1>
<div id="cta"><b></b><span>squai.io</span></div>
</div>
<script>
const DATA = {{data}};
const SERVICES = {
  grow: { main: "#44d4c8", main3: "#c8f1ec", hl: "#f9c24d" },
  learn: { main: "#f9c24d", main3: "#ffe6a6", hl: "#8a8ef9" },
  one: { main: "#8a8ef9", main3: "#e4e6f7", hl: "#44d4c8" },
};
const service = SERVICES[String(DATA.service).trim().toLowerCase()] || SERVICES.grow;
const style = document.documentElement.style;
style.setProperty("--main", service.main);
style.setProperty("--main3", service.main3);
style.setProperty("--hl", service.hl);

const root = document.getElementById("root");
const edit = DATA.edit || { hook: "", cta: "", words: [], captions: [], moments: [] };
const total = DATA.duration;
const node = (tag, name, text) => {
  const element = document.createElement(tag);
  element.className = name;
  if (text) element.textContent = text;
  return element;
};
if (!document.getElementById("footage").getAttribute("src")) document.getElementById("footage").remove();

const timeline = gsap.timeline({ paused: true });
timeline.to("#progress i", { scaleX: 1, duration: total, ease: "none" }, 0);

const HOOK_SECONDS = Math.min(3, total / 3);
if (edit.hook) {
  const hook = document.getElementById("hook");
  edit.hook.split(/(\[\[.+?\]\])/).filter(Boolean).forEach((part) => {
    const marked = part.startsWith("[[");
    const holder = marked ? node("span", "mark") : hook;
    (marked ? part.slice(2, -2) : part).split(/(\s+)/).forEach((word) => {
      if (word.trim()) holder.append(node("span", "w", word));
      else if (word) holder.append(" ");
    });
    if (marked) hook.append(holder);
  });
  let size = 112;
  while (size > 64 && hook.scrollWidth > hook.clientWidth) {
    size -= 4;
    hook.style.fontSize = `${size}px`;
  }
  const words = hook.querySelectorAll(".w");
  timeline.set(hook, { visibility: "visible" }, 0);
  timeline.fromTo(words, { opacity: 0, y: 60, rotation: 4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.6)", stagger: 0.06 }, 0.1);
  if (hook.querySelector(".mark")) timeline.fromTo(hook.querySelectorAll(".mark"), { "--ink": 0 }, { "--ink": 1, duration: 0.4, ease: "power3.out" }, 0.3 + words.length * 0.06);
  timeline.to(hook, { opacity: 0, y: -60, duration: 0.3, ease: "power3.in" }, HOOK_SECONDS - 0.3);
  timeline.set(hook, { visibility: "hidden" }, HOOK_SECONDS);
}

const END = edit.cta ? total - Math.min(2.6, total / 4) : total;
edit.captions.forEach((caption) => {
  if (caption.start >= END) return;
  const line = node("div", "caption");
  const spans = caption.words.map((index) => {
    const word = edit.words[index];
    const span = node("span", word.strong ? "strong" : "", word.text);
    line.append(span);
    return { span, word };
  });
  root.append(line);
  const end = Math.min(caption.end, END);
  timeline.set(line, { visibility: "visible" }, caption.start);
  timeline.fromTo(line, { scale: 0.86, y: 18 }, { scale: 1, y: 0, duration: 0.22, ease: "back.out(2.2)" }, caption.start);
  spans.forEach(({ span, word }) => {
    const at = Math.max(caption.start, word.start);
    timeline.fromTo(span, { opacity: 0.45, scale: 0.94 }, { opacity: 1, scale: 1.06, duration: 0.12, ease: "power2.out" }, at);
    timeline.to(span, { scale: 1, duration: 0.18, ease: "power2.out" }, at + 0.12);
  });
  timeline.set(line, { visibility: "hidden" }, end);
});

let side = 0;
edit.moments.forEach((moment) => {
  const at = Math.max(moment.start, edit.hook ? HOOK_SECONDS : 0);
  const seconds = Math.min(moment.seconds, END - at);
  if (seconds < 0.6) return;
  if (moment.kind === "zoom") {
    timeline.to("#stage", { scale: 1.14, duration: 0.35, ease: "power3.out" }, at);
    timeline.to("#stage", { scale: 1, duration: 0.5, ease: "power2.inOut" }, at + seconds - 0.5);
    return;
  }
  const note = moment.kind === "note";
  const box = node("div", `moment ${note ? "note" : `keyword${side % 2 ? " right" : ""}`}`, moment.text);
  if (!note) side += 1;
  root.append(box);
  const tilt = note ? -4 : side % 2 ? -3 : 3;
  timeline.set(box, { visibility: "visible" }, at);
  timeline.fromTo(box, { opacity: 0, scale: 0.4, rotation: tilt * 4 }, { opacity: 1, scale: 1, rotation: tilt, duration: 0.45, ease: "back.out(2)" }, at);
  timeline.to(box, { opacity: 0, scale: 0.8, y: -30, duration: 0.25, ease: "power2.in" }, at + seconds - 0.25);
  timeline.set(box, { visibility: "hidden" }, at + seconds);
});

if (edit.cta) {
  document.querySelector("#cta b").textContent = edit.cta;
  timeline.set("#cta", { visibility: "visible" }, END);
  timeline.fromTo("#cta", { opacity: 0, y: 160, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.5)" }, END);
}

window.__timelines = window.__timelines || {};
window.__timelines["main"] = timeline;
timeline.seek(0);
</script>
</body>
</html>
