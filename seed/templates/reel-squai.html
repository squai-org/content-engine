<html lang="es">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@700&family=Atkinson+Hyperlegible+Next:wght@400;600&family=Gloria+Hallelujah&display=swap">
<style>
:root { --mid: #0A0C1A; --canvas: #F4F6FF; --main: #44d4c8; --main3: #c8f1ec; --hl: #f9c24d; --dur: 4s; --after: 1s; --head: 'Familjen Grotesk', 'Arial Narrow', sans-serif; --body: 'Atkinson Hyperlegible Next', 'Segoe UI', sans-serif; --hand: 'Gloria Hallelujah', cursive; }
* { box-sizing: border-box; margin: 0; }
body { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--canvas); color: var(--mid); font-family: var(--body); }
body.first, body.last { background: var(--main); }
.grid { position: absolute; inset: 0; background-image: linear-gradient(to right, var(--line) 2px, transparent 2px), linear-gradient(to bottom, var(--line) 2px, transparent 2px); background-size: 180px 240px; background-position: -1px -1px; --line: #E3E7F5; }
.first .grid, .last .grid { --line: rgba(10, 12, 26, 0.08); }
.shape { position: absolute; fill: var(--main3); transform: rotate(var(--turn)); animation: drift var(--dur) linear both; }
.shape.a { left: -190px; top: 1500px; width: 560px; --turn: -6deg; --x: 60px; --y: -90px; }
.shape.b { right: -210px; top: 120px; width: 470px; --turn: 5deg; --x: -50px; --y: 70px; }
.progress { position: absolute; left: 90px; right: 90px; top: 150px; display: flex; gap: 10px; z-index: 3; }
.progress i { flex: 1; height: 8px; border-radius: 4px; background: rgba(10, 12, 26, 0.18); overflow: hidden; }
.progress i.done { background: var(--mid); }
.progress i.now::after { content: ''; display: block; height: 100%; background: var(--mid); transform-origin: left; animation: fill var(--dur) linear both; }
.handle { position: absolute; left: 90px; top: 196px; z-index: 3; font-family: var(--head); font-weight: 700; font-size: 44px; letter-spacing: -0.5px; }
.stage { position: absolute; left: 90px; right: 90px; top: 290px; bottom: 460px; z-index: 2; display: flex; flex-direction: column; justify-content: center; gap: 44px; animation: leave 0.3s ease-in calc(var(--dur) - 0.3s) both; }
.last .stage { animation: none; }
.kicker { align-self: flex-start; padding: 10px 26px; border-radius: 999px; background: var(--mid); color: var(--canvas); font-weight: 600; font-size: 34px; letter-spacing: 0.04em; text-transform: uppercase; animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s both; }
.t { font-family: var(--head); font-weight: 700; letter-spacing: -0.03em; line-height: 1.12; text-wrap: balance; }
.t .w { display: inline-block; animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.t mark { position: relative; color: inherit; background: none; padding: 0 0.16em; margin: 0 -0.06em; white-space: nowrap; }
.t mark::before { content: ''; position: absolute; inset: 0.08em 0 0.02em; z-index: -1; border-radius: 0.3em; background: var(--hl); transform-origin: left; animation: fill 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) var(--after) both; }
.sup { font-size: 54px; line-height: 1.32; text-wrap: balance; animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) var(--after) both; }
.sup mark { color: inherit; background: none; font-weight: 600; }
.annot { font-family: var(--hand); font-size: 50px; line-height: 1.3; transform-origin: left; animation: scribble 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--after) + 0.5s) both; }
.kicker:empty, .sup:empty, .annot:empty { display: none; }
.url { position: absolute; left: 90px; bottom: 470px; z-index: 3; display: none; font-family: var(--head); font-weight: 700; font-size: 64px; letter-spacing: -1px; animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--after) + 0.3s) both; }
.last .url { display: block; }
.last .stage { bottom: 600px; }
@keyframes rise { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: none; } }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes scribble { from { opacity: 0; transform: rotate(-5deg) scale(0.9); } to { opacity: 1; transform: rotate(-2deg); } }
@keyframes leave { to { opacity: 0; transform: translateY(-40px); } }
@keyframes drift { to { margin-left: var(--x); margin-top: var(--y); } }
</style>
</head>

<script>
const SERVICES = {
  grow: { main: "#44d4c8", main3: "#c8f1ec", hl: "#f9c24d" },
  learn: { main: "#f9c24d", main3: "#ffe6a6", hl: "#8a8ef9" },
  one: { main: "#8a8ef9", main3: "#e4e6f7", hl: "#44d4c8" },
};
const data = document.body.dataset;
const service = SERVICES[data.service.trim().toLowerCase()] || SERVICES.grow;
const total = Number(data.total) || 1;
const index = (Number(data.index) || 1) - 1;
const root = document.documentElement.style;
root.setProperty("--main", service.main);
root.setProperty("--main3", service.main3);
root.setProperty("--hl", service.hl);

document.getElementById("progress").innerHTML = Array.from({ length: total }, (_, step) =>
  `<i class="${step < index ? "done" : step === index ? "now" : ""}"></i>`).join("");

const title = document.querySelector(".t");
let words = 0;
function split(node) {
  for (const child of [...node.childNodes]) {
    if (child.nodeType === 3) {
      const pieces = document.createDocumentFragment();
      for (const part of child.textContent.split(/(\s+)/)) {
        if (!part.trim()) { pieces.append(part); continue; }
        const word = document.createElement("span");
        word.className = "w";
        word.textContent = part;
        word.style.animationDelay = `${(0.25 + words * 0.07).toFixed(2)}s`;
        words += 1;
        pieces.append(word);
      }
      child.replaceWith(pieces);
    } else if (child.nodeType === 1 && child.tagName !== "BR") {
      split(child);
    }
  }
}
split(title);
document.body.style.setProperty("--after", `${(0.45 + words * 0.07).toFixed(2)}s`);

const stage = document.querySelector(".stage");
function fit() {
  let size = index === 0 ? 150 : 128;
  title.style.fontSize = `${size}px`;
  while (size > 64 && (stage.scrollHeight > stage.clientHeight || title.scrollWidth > title.clientWidth)) {
    size -= 4;
    title.style.fontSize = `${size}px`;
  }
}
fit();
document.fonts.ready.then(fit);
</script>
